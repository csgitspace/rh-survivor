<!--
  Roy-Hart Survivor Week — Shared Theme & Styles
  
  All design tokens (colors, fonts, spacing, motion) live here.
  Aesthetic: Expedition log meets tribal council.
    - Display: Cinzel (carved tribal stone)
    - Body:    Spectral (refined serif, very readable on TV screens)
  Color story: deep forest base, parchment cards, ember accents.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cinzel+Decorative:wght@700;900&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

<style>
  /* ====================================================================
     DESIGN TOKENS
     ==================================================================== */
  :root {
    /* Brand chrome (Roy-Hart school colors) */
    --rh-purple:        #5D3B85;
    --rh-purple-deep:   #2D1B3D;
    --rh-white:         #F3F3EE;

    /* Atmosphere — deep jungle / canvas tent at dusk */
    --bg-base:          #0F1814;          /* near-black forest */
    --bg-deep:          #0A0F0C;
    --bg-glow:          #1A2D24;          /* subtle green pull */
    --parchment:        #E8DDC4;          /* aged paper */
    --parchment-soft:   #F0E7D2;
    --parchment-dark:   #C8B98F;

    /* Ink / text */
    --ink:              #1A1410;          /* dark ink for parchment */
    --ink-soft:         #4A3F33;
    --ink-faded:        #7A6E5F;
    --ink-cream:        #E8DDC4;          /* parchment-on-dark */
    --ink-cream-soft:   #B8AB91;

    /* Accents */
    --ember:            #E2723F;          /* torch flame */
    --ember-deep:       #C8542B;
    --jade:             #4A8C68;          /* survival green */
    --bone:             #E8DDC4;
    --blood:            #8B2D29;          /* tribal council deep red */

    /* Tribe colors (sourced from Config.gs but mirrored here for CSS use) */
    --tribe-marlin:     #1F6FB8;
    --tribe-bone:       #F3F3EE;
    --tribe-orchid:     #6B3FA0;
    --tribe-ember:      #C8332B;
    --tribe-hibiscus:   #E5559C;
    --tribe-fern:       #3B8C4F;

    /* Type */
    --font-display:     'Cinzel', 'Cinzel Decorative', Georgia, serif;
    --font-body:        'Spectral', Georgia, 'Times New Roman', serif;

    /* Motion */
    --ease-stage:       cubic-bezier(0.22, 1, 0.36, 1);
    --ease-snap:        cubic-bezier(0.4, 0, 0.2, 1);

    /* Layering */
    --shadow-card:      0 1px 0 rgba(255,255,255,0.04) inset,
                        0 8px 24px rgba(0,0,0,0.45),
                        0 2px 6px rgba(0,0,0,0.3);
    --shadow-deep:      0 24px 48px rgba(0,0,0,0.55);
  }

  /* ====================================================================
     BASE
     ==================================================================== */
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: var(--bg-base);
    color: var(--ink-cream);
    font-family: var(--font-body);
    font-size: 18px;
    line-height: 1.6;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  /* Atmospheric background — layered jungle dusk + paper grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
      radial-gradient(ellipse 80% 60% at 20% 0%,    rgba(93, 59, 133, 0.18) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 100% 100%, rgba(74, 140, 104, 0.15) 0%, transparent 65%),
      radial-gradient(ellipse 50% 30% at 50% 100%,  rgba(226, 114, 63, 0.08) 0%, transparent 70%),
      linear-gradient(180deg, var(--bg-base) 0%, var(--bg-deep) 100%);
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: 0.04;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* ====================================================================
     TYPOGRAPHY
     ==================================================================== */
  h1, h2, h3, h4 {
    font-family: var(--font-display);
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.15;
    margin: 0 0 0.6em 0;
  }
  h1 { font-size: clamp(1.9rem, 3.2vw, 2.8rem); letter-spacing: 0.06em; }
  h2 { font-size: clamp(1.5rem, 2.4vw, 2rem); }
  h3 { font-size: 1.2rem; letter-spacing: 0.06em; text-transform: uppercase; }
  h4 { font-size: 0.95rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-cream-soft); }
  p  { margin: 0 0 1em 0; }

  .display-xl {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(2.4rem, 5vw, 4rem);
    letter-spacing: 0.08em;
    line-height: 1;
    text-transform: uppercase;
  }
  .eyebrow {
    font-family: var(--font-display);
    font-size: 0.92rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ember);
    font-weight: 600;
  }
  .ornament {
    color: var(--parchment-dark);
    letter-spacing: 0.5em;
    font-size: 0.8rem;
    text-align: center;
    margin: 0.2em 0 1em;
    user-select: none;
  }

  /* ====================================================================
     LAYOUT PRIMITIVES
     ==================================================================== */
  .shell {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 clamp(1rem, 3vw, 2rem);
  }

  .top-bar {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 1.5rem;
    padding: 1.1rem clamp(1rem, 3vw, 2rem);
    border-bottom: 1px solid rgba(232, 221, 196, 0.1);
    background: linear-gradient(180deg, rgba(45, 27, 61, 0.6), rgba(15, 24, 20, 0.3));
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .top-bar .brand {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--parchment);
  }
  .top-bar .brand-divider { opacity: 0.5; margin-left: 0.7em; }
  .top-bar .brand-dates {
    color: var(--ember);
    font-weight: 600;
    letter-spacing: 0.16em;
  }
  .top-bar .brand-mark {
    width: 38px; height: 38px;
    border: 1.5px solid var(--parchment-dark);
    display: grid; place-items: center;
    color: var(--ember);
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 0.95rem;
    transform: rotate(45deg);
    position: relative;
    flex-shrink: 0;
  }
  .top-bar .brand-mark span { transform: rotate(-45deg); }

  /* Navigation links */
  .top-nav {
    display: flex;
    gap: 0.4rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  .nav-link {
    font-family: var(--font-display);
    font-size: 0.88rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-cream-soft);
    text-decoration: none;
    padding: 0.6rem 1rem;
    border: 1px solid transparent;
    border-radius: 2px;
    transition: all 150ms var(--ease-snap);
  }
  .nav-link:hover {
    color: var(--parchment);
    background: rgba(232, 221, 196, 0.06);
  }
  .nav-link.active {
    color: var(--ember);
    border-color: rgba(226, 114, 63, 0.4);
    background: rgba(226, 114, 63, 0.06);
  }

  .top-bar .user {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    font-size: 0.95rem;
    color: var(--ink-cream-soft);
    justify-self: end;
  }
  .top-bar .user-email {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 240px;
  }
  .top-bar .user .role-pill {
    font-family: var(--font-display);
    font-size: 0.78rem;
    letter-spacing: 0.14em;
    padding: 0.32rem 0.8rem;
    border: 1px solid var(--ember);
    color: var(--ember);
    text-transform: uppercase;
    border-radius: 999px;
    flex-shrink: 0;
  }

  /* Stack on narrow screens */
  @media (max-width: 800px) {
    .top-bar {
      grid-template-columns: 1fr;
      gap: 0.7rem;
      text-align: center;
    }
    .top-bar .brand { justify-content: center; }
    .top-nav { justify-content: center; }
    .top-bar .user { justify-self: center; }
  }

  /* ====================================================================
     PARCHMENT CARD — primary surface for content
     ==================================================================== */
  .parchment {
    position: relative;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(255, 255, 255, 0.4), transparent 50%),
      radial-gradient(ellipse at 100% 100%, rgba(184, 158, 110, 0.3), transparent 50%),
      linear-gradient(165deg, var(--parchment-soft) 0%, var(--parchment) 60%, var(--parchment-dark) 100%);
    color: var(--ink);
    padding: clamp(1.5rem, 3vw, 2.4rem);
    box-shadow: var(--shadow-card);
    border-radius: 2px;
    overflow: hidden;
  }
  .parchment::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.18;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='0.6' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23p)'/></svg>");
    mix-blend-mode: multiply;
  }
  .parchment > * { position: relative; }

  .parchment h1, .parchment h2, .parchment h3, .parchment h4 { color: var(--ink); }
  .parchment .eyebrow { color: var(--ember-deep); }

  /* Dark "council" variant for tribal-vote panels */
  .council {
    position: relative;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(226, 114, 63, 0.18), transparent 60%),
      linear-gradient(180deg, #1A0E0A 0%, #0A0604 100%);
    color: var(--ink-cream);
    padding: clamp(1.5rem, 3vw, 2.4rem);
    border: 1px solid rgba(226, 114, 63, 0.18);
    box-shadow: var(--shadow-deep);
  }
  .council h1, .council h2, .council h3 { color: var(--parchment); }

  /* ====================================================================
     BUTTONS
     ==================================================================== */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-family: var(--font-display);
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 0.85rem 1.5rem;
    border: 1px solid var(--parchment-dark);
    background: transparent;
    color: var(--parchment);
    cursor: pointer;
    transition: all 200ms var(--ease-snap);
    text-decoration: none;
  }
  .btn:hover {
    background: var(--parchment);
    color: var(--bg-base);
    transform: translateY(-1px);
  }
  .btn-primary {
    background: var(--ember);
    border-color: var(--ember);
    color: var(--bg-deep);
  }
  .btn-primary:hover { background: var(--ember-deep); border-color: var(--ember-deep); color: var(--parchment); }
  .btn-ghost {
    border-color: rgba(232, 221, 196, 0.3);
    color: var(--ink-cream-soft);
  }
  .btn-on-parchment {
    border-color: var(--ink-soft);
    color: var(--ink);
  }
  .btn-on-parchment:hover { background: var(--ink); color: var(--parchment); }

  /* ====================================================================
     TRIBE FLAG — color swatch with name
     ==================================================================== */
  .tribe-flag {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    font-family: var(--font-display);
    font-weight: 700;
    letter-spacing: 0.06em;
    font-size: 1rem;
    text-transform: uppercase;
  }
  .tribe-flag .swatch {
    width: 22px; height: 22px;
    border-radius: 3px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.3) inset, 0 1px 2px rgba(0,0,0,0.4);
  }

  /* ====================================================================
     STATUS / PILLS
     ==================================================================== */
  .pill {
    display: inline-block;
    font-family: var(--font-display);
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.32rem 0.8rem;
    border-radius: 999px;
    border: 1px solid currentColor;
  }
  .pill-active { color: var(--jade); }
  .pill-jury   { color: var(--ember); }
  .pill-admin  { color: var(--rh-purple); border-color: var(--rh-purple); }

  /* ====================================================================
     ANIMATIONS — staggered entrance
     ==================================================================== */
  .fade-up { animation: fadeUp 700ms var(--ease-stage) backwards; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .stagger > * { animation: fadeUp 700ms var(--ease-stage) backwards; }
  .stagger > *:nth-child(1) { animation-delay: 0ms; }
  .stagger > *:nth-child(2) { animation-delay: 80ms; }
  .stagger > *:nth-child(3) { animation-delay: 160ms; }
  .stagger > *:nth-child(4) { animation-delay: 240ms; }
  .stagger > *:nth-child(5) { animation-delay: 320ms; }
  .stagger > *:nth-child(6) { animation-delay: 400ms; }

  /* Torch flicker (used for tribal-council pages) */
  @keyframes flicker {
    0%, 100% { opacity: 0.9; }
    35%      { opacity: 0.65; }
    62%      { opacity: 1; }
    78%      { opacity: 0.78; }
  }
  .torch-flicker { animation: flicker 3.4s ease-in-out infinite; }

  /* ====================================================================
     UTILS
     ==================================================================== */
  .center      { text-align: center; }
  .mono        { font-variant-numeric: tabular-nums; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  .stack > * + * { margin-top: var(--stack, 1rem); }
  .row { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }

  /* ====================================================================
     PHASE-1 SCAFFOLD STYLES — the "under construction" badges that
     subsequent phases will replace.
     ==================================================================== */
  .scaffold-hero {
    text-align: center;
    padding: clamp(2rem, 6vw, 4rem) 0 clamp(1.5rem, 4vw, 3rem);
  }
  .scaffold-hero .crest {
    width: 90px; height: 90px;
    margin: 0 auto 1.4rem;
    border: 1.5px solid var(--parchment-dark);
    display: grid; place-items: center;
    color: var(--ember);
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.3rem;
    transform: rotate(45deg);
    position: relative;
  }
  .scaffold-hero .crest::before, .scaffold-hero .crest::after {
    content: '';
    position: absolute;
    background: var(--parchment-dark);
    width: 8px; height: 8px;
    border-radius: 50%;
  }
  .scaffold-hero .crest::before { top: -5px; left: -5px; }
  .scaffold-hero .crest::after  { bottom: -5px; right: -5px; }
  .scaffold-hero .crest span { transform: rotate(-45deg); }

  .scaffold-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.2rem;
    margin-top: 2rem;
  }
  .scaffold-tile {
    padding: 1.4rem 1.5rem;
    border: 1px solid rgba(232, 221, 196, 0.08);
    background: rgba(232, 221, 196, 0.025);
    transition: border-color 200ms var(--ease-snap), background 200ms var(--ease-snap);
  }
  .scaffold-tile:hover {
    border-color: rgba(226, 114, 63, 0.3);
    background: rgba(226, 114, 63, 0.04);
  }
  .scaffold-tile h3 { color: var(--parchment); margin-bottom: 0.4rem; }
  .scaffold-tile p { color: var(--ink-cream-soft); font-size: 1.02rem; margin: 0; }
  .scaffold-tile .phase-tag {
    display: inline-block;
    margin-top: 0.8rem;
    font-family: var(--font-display);
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--parchment-dark);
  }

  /* Footer */
  .foot {
    text-align: center;
    padding: 2rem 1rem 3rem;
    color: var(--ink-cream-soft);
    font-size: 0.95rem;
    letter-spacing: 0.06em;
  }
  .foot .ornament { color: var(--parchment-dark); margin: 0.5em 0; }
</style>
